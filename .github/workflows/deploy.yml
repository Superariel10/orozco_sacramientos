# .github/workflows/deploy.yml
name: Orozco Sacramento API — CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ── Job 1: Tests ──────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB:       sacramento_test_db
          POSTGRES_USER:     sacramento_user
          POSTGRES_PASSWORD: sacramento_pass_123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        env:
          SECRET_KEY:    test-secret-key-for-ci-only
          DEBUG:         True
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_NAME:       sacramento_test_db
          DB_USER:       sacramento_user
          DB_PASSWORD:   sacramento_pass_123
          DB_HOST:       localhost
          DB_PORT:       5432
          TEST_DB_NAME:  sacramento_test_db
          CORS_ALLOW_ALL_ORIGINS: True
        run: uv run python manage.py test --verbosity=2

  # ── Job 2: Deploy ─────────────────────────────────────────
  deploy:
    name: Deploy to Azure VM
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VM
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh $VPS_USER@$VPS_HOST << ENDSSH
            set -e

            echo "=== DEPLOY START ==="

            echo "Repositorio:"
            cd "$DEPLOY_PATH"

            if [ ! -d ".git" ]; then
              echo "ERROR: No se encontró la carpeta .git"
              exit 1
            fi

            echo "Directorio actual:"
            pwd

            echo "Actualizando código..."
            git fetch origin
            git reset --hard origin/main

            echo "Instalando dependencias..."
            uv sync --frozen

            echo "Aplicando migraciones..."
            uv run python manage.py migrate --noinput

            echo "Recolectando archivos estáticos..."
            uv run python manage.py collectstatic --noinput --clear

            echo "Reiniciando Gunicorn..."
            sudo systemctl restart gunicorn-sacramento

            echo "Reiniciando Nginx..."
            sudo systemctl restart nginx

            echo "Verificando servicios..."
            sudo systemctl is-active gunicorn-sacramento
            sudo systemctl is-active nginx

            echo "Verificando API..."
            sleep 5

            curl --fail http://20.163.1.12/api/health/

            echo ""
            echo "=== DEPLOY EXITOSO ==="
          ENDSSH